<text x="24" y="58" class="l" style="animation-delay:.2s"><tspan class="k">$</tspan> whoami</text>
<text x="24" y="82" class="l p" style="animation-delay:.7s">Narcis-Eusebiu Morong, he/him</text>
<text x="24" y="116" class="l" style="animation-delay:1.2s"><tspan class="k">role</tspan>       <tspan class="d">:</tspan> full-stack developer</text>
<text x="24" y="140" class="l" style="animation-delay:1.6s"><tspan class="k">stack</tspan>      <tspan class="d">:</tspan> Rails · Angular · Flutter · Python · PostgreSQL</text>
