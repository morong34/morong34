<text x="24" y="212" class="l" style="animation-delay:2.8s"><tspan class="k">location</tspan>   <tspan class="d">:</tspan> Timișoara, Romania</text>
<text x="24" y="238" class="l" style="animation-delay:3.2s"><tspan class="k">$</tspan> <tspan class="cur">▋</tspan></text>
