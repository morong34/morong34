<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="narcis@timisoara: full-stack developer working with Rails, Angular, Flutter, Python and AI agents">
<style>
.b{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#c9d1d9}
.k{fill:#39d353;font-weight:700}
.d{fill:#8b949e}
.p{fill:#58a6ff}
.l{opacity:0;animation:in .5s ease-out forwards}
